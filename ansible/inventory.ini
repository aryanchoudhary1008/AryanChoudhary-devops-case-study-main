# Target hosts for the FinVeritas runtime environment.
# Run from WSL (Ubuntu) or any Linux machine:  ansible-playbook playbook.yml -K

[appservers]
# Configure the local WSL / Linux machine
localhost ansible_connection=local

# Example remote VM - uncomment and edit to configure a real server over SSH
# finveritas-vm1 ansible_host=192.168.56.10 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_ed25519

[appservers:vars]
ansible_python_interpreter=/usr/bin/python3
