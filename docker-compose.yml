# Local stack without Kubernetes: API + Prometheus + Grafana
#   docker compose up -d --build
#   API        http://localhost:5000
#   Prometheus http://localhost:9090
#   Grafana    http://localhost:3000  (dashboard: FinVeritas > FinVeritas Ratio Service)
services:
  api:
    build:
      context: .
      args:
        APP_VERSION: "1.0.0-compose"
    image: finveritas-api:local
    ports:
      - "5000:5000"
    environment:
      FAULT_RATE: "0"
      EXTRA_LATENCY_MS: "0"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.15.0
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.3
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"        # local demo only
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_SECURITY_ADMIN_PASSWORD: "admin"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana-dashboard.json:/var/lib/grafana/dashboards/finveritas-dashboard.json:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
