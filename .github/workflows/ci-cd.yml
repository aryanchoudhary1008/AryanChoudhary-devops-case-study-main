name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  PYTHON_VERSION: "3.12"

jobs:
  # ── Stage 1: Continuous Integration ─────────────────────────────────────────
  test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (flake8)
        run: flake8 app tests

      - name: Run tests with coverage gate
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=85

  # ── Stage 2: Security scanning ──────────────────────────────────────────────
  security:
    name: Security Scan (SAST + dependencies)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install scanners
        run: pip install bandit pip-audit

      - name: Static analysis (bandit)
        run: bandit -r app -ll

      - name: Dependency vulnerability audit (pip-audit)
        run: pip-audit -r requirements.txt

  # ── Stage 3: Build & publish the container image ────────────────────────────
  build-and-push:
    name: Build & Push Image (GHCR)
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.vars.outputs.image }}
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Compute image name and tag
        id: vars
        run: |
          echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: APP_VERSION=${{ steps.vars.outputs.tag }}
          tags: |
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}
            ${{ steps.vars.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Stage 4: Continuous Deployment to Kubernetes ────────────────────────────
  deploy:
    name: Deploy to Kubernetes (kind) & Smoke Test
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ${{ needs.build-and-push.outputs.image }}:${{ needs.build-and-push.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Create Kubernetes cluster (kind)
        uses: helm/kind-action@v1
        with:
          cluster_name: finveritas

      - name: Pull the image built in the previous stage
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull "$IMAGE"
          kind load docker-image "$IMAGE" --name finveritas

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml -f k8s/deployment.yaml -f k8s/service.yaml

      - name: Rolling update to the new image
        run: |
          kubectl -n finveritas set image deployment/finveritas-api api="$IMAGE"
          kubectl -n finveritas annotate deployment/finveritas-api \
            kubernetes.io/change-cause="CI deploy ${IMAGE##*:}" --overwrite
          kubectl -n finveritas rollout status deployment/finveritas-api --timeout=180s

      - name: Smoke test
        run: |
          kubectl -n finveritas port-forward svc/finveritas-api 8080:80 >/tmp/pf.log 2>&1 &
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8080/health && break; sleep 2; done
          echo
          curl -fs http://127.0.0.1:8080/api/v1/sample | python3 -m json.tool | head -30
          curl -fs -X POST http://127.0.0.1:8080/api/v1/liquidity \
            -H "Content-Type: application/json" \
            -d '{"current_assets": 300, "current_liabilities": 100, "cash_and_equivalents": 40}'
          echo
          curl -fs http://127.0.0.1:8080/metrics | grep -E "^(app_info|flask_http_request_total)" | head

      - name: Deployment summary
        if: always()
        run: |
          kubectl -n finveritas get deployment,pods,svc -o wide
          kubectl -n finveritas rollout history deployment/finveritas-api
          {
            echo "### Deployed \`${IMAGE}\`"
            echo '```'
            kubectl -n finveritas get pods -o wide
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
